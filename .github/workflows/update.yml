name: Forecast pipeline
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pipeline/update.mjs
      - name: Commit data
        run: |
          git config user.name "vantage-bot"
          git config user.email "bot@users.noreply.github.com"
          git add forecasts.json signals.json ledger.json external-forecasts.json data/gdelt-daily.json
          git diff --cached --quiet || git commit -m "data: forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
